app:
  name: kuruma-back
  env: development

http:
  port: 8080

database:
  driver: postgres
  dsn: postgres://postgres:postgres@localhost:5432/kuruma?sslmode=disable

auth:
  jwt_secret: change-me
  jwt_expires_hours: 24

redis:
  addr: localhost:6379

storage:
  local_path: ./storage

bigmodel:
  api_key: ""
  endpoint: https://open.bigmodel.cn/api/paas/v4/audio/transcriptions
  model: glm-asr-2512
  max_audio_mb: 25
